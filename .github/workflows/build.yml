name: build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * *"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: suhaiman
          POSTGRES_PASSWORD: suhaiman
          POSTGRES_DB: suhaiman_km
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suhaiman -d suhaiman_km"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Backend lint
        working-directory: backend
        run: ruff check app tests
      - name: Backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://suhaiman:suhaiman@localhost:5432/suhaiman_km
        run: pytest
      - name: Frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

  ai-quality-smoke:
    # Per-PR gate. Runs the 5-query smoke benchmark against a backend
    # spun up via docker-compose. Requires OPENAI_API_KEY secret.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Boot stack (no LLM-dependent flag forced)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > .env <<EOF
          ENV=dev
          LLM_REQUIRED=true
          LLM_MODEL=gpt-5
          EMBEDDINGS_MODEL=text-embedding-3-large
          EMBEDDINGS_DIMENSIONS=1536
          OCR_MODEL=gpt-5
          DATABASE_URL=postgresql+psycopg://suhaiman:suhaiman@postgres:5432/suhaiman_km
          OPENAI_API_KEY=${OPENAI_API_KEY}
          EOF
          docker compose up -d --build
          for i in {1..60}; do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null; then break; fi
            sleep 2
          done
      - name: Smoke benchmark (5 queries)
        run: python scripts/run_ai_quality.py --mode smoke

  ai-quality-full:
    # Full benchmark + faithfulness eval. Runs on push to main and
    # nightly. Gates merges to main via branch protection on this job.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Boot stack
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > .env <<EOF
          ENV=dev
          LLM_REQUIRED=true
          LLM_MODEL=gpt-5
          EMBEDDINGS_MODEL=text-embedding-3-large
          EMBEDDINGS_DIMENSIONS=1536
          OCR_MODEL=gpt-5
          DATABASE_URL=postgresql+psycopg://suhaiman:suhaiman@postgres:5432/suhaiman_km
          OPENAI_API_KEY=${OPENAI_API_KEY}
          EOF
          docker compose up -d --build
          for i in {1..60}; do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null; then break; fi
            sleep 2
          done
      - name: Full retrieval benchmark (20 queries)
        run: python scripts/run_ai_quality.py --mode full
      - name: Faithfulness eval (20 Q/A pairs)
        run: python scripts/run_rag_faithfulness.py

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-plan:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra
