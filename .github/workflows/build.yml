name: build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * *"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: suhaiman
          POSTGRES_PASSWORD: suhaiman
          POSTGRES_DB: suhaiman_km
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suhaiman -d suhaiman_km"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Backend lint
        working-directory: backend
        run: ruff check app tests
      - name: Backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://suhaiman:suhaiman@localhost:5432/suhaiman_km
        run: pytest
      - name: Frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

  ai-quality-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run AI smoke benchmark
        run: python scripts/run_ai_quality.py --mode smoke

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-plan:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra
